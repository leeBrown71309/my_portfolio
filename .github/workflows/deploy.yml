name: Deploy Portfolio
on:
  push:
    branches:
      - main # Le déploiement se lancera à chaque push

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Toujours utiliser le SHA complet, pas le tag
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Deploy to VPS
        uses: appleboy/ssh-action@8fdfeb034ef6e9033a8a4407975aedbc12a08737
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Aller dans le dossier du projet
            cd /var/www/leeeight-portfolio

            # Si le dossier est vide, on clone, sinon on pull
            git fetch origin main
            git reset --hard origin/main

            # Installation de Bun (au cas où) et déploiement
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"

            bun install
            bun run build

            # Lancement ou redémarrage avec PM2
            pm2 restart leeeight-portfolio || pm2 start .output/server/index.mjs --name "leeeight-portfolio"
            pm2 save
