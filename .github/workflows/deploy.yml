name: Deploy Portfolio V2

on:
  push:
    branches:
      - dev_v2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production output
        run: bun run build

      - name: Inspect VPS capacity
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -e

            echo "Disk usage"
            df -h /var/www/leeeight-portfolio /tmp

            echo "Memory usage"
            free -h

            echo "System load"
            uptime

            echo "Top processes"
            ps -eo pid,ppid,stat,etime,%cpu,%mem,cmd --sort=-%cpu | head -20

            echo "Build-related processes"
            pgrep -af "bun|vite|node|pm2" || true

      - name: Upload production output
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".output/*"
          target: "/var/www/leeeight-portfolio/.output-next"
          rm: true
          overwrite: true
          command_timeout: 10m

      - name: Activate production output
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e

            cd /var/www/leeeight-portfolio

            rm -rf .output
            mv .output-next .output

            pm2 delete portfolio || true
            pm2 start .output/server/index.mjs --name "portfolio"
            pm2 save
